; SKMod options (SENRAN KAGURA ESTIVAL VERSUS mod). Read by dinput8.dll at every game start: close the game, edit, start it.
; Every fix is independent; 0 = off (original game behaviour). What was applied: skmod.log
[SKMod]

MipFix=1            ; 1 = build mipmaps for textures shipped without them or with too few (most stage/object textures:
                    ; distant shimmer, e.g. the wooden deck). Slightly longer loading. 0 = original
Anisotropy=16       ; anisotropic filtering level for trilinear-filtered textures: 1..16, 0 = original
MaxResolution=0     ; e.g. 3840x2160: in the Fullscreen screen mode the game renders at this size and
                    ; switches the display to it - for NVIDIA DSR / AMD VSR (enable the factor in the
                    ; driver first). The game itself always used the desktop size there. Never more than
                    ; the largest mode the display offers. Window/borderless unchanged. 0 = original
ShadowResolution=3072 ; shadow map size: 1536 (original), 2048, 3072 (recommended), 4096. Bigger = finer
                    ; shadows with less crawling/grain in motion. Video memory: 3072 ~0.5 GB, 4096 ~0.9 GB
AOBlur=1            ; 1 = smooth the ambient occlusion (the game shows it unfiltered: grainy, crawling dark
                    ; noise in creases and where objects meet, e.g. under the bungalow). 0 = original

SkipIntro=2         ; boot: Marvelous movie, XSEED, Tamsoft and CRI logos, then the opening movie
                    ; 0 = original | 1 = skip the logos, keep the opening movie | 2 = skip both
                    ; (the very first start still shows the prologue, as the game does)

FrameRate=60        ; 60 (original) .. 360: the in-game 60 fps setting runs at this rate, 30 at half of it.
                    ; Game speed stays right (it advances by the measured frame time). With V-Sync on,
                    ; the monitor's refresh rate is still the limit.
