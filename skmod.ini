; ============================================================
;  SKEV+ settings - SENRAN KAGURA ESTIVAL VERSUS
; ============================================================
;  Read at every game start: close the game, edit, start it again.
;  Every fix works on its own. 0 always means "off, like the
;  original game". What was applied is listed in skmod.log.
; ============================================================
[SKMod]


; ============================================================
;  GRAPHICS
; ============================================================

; --- Mipmaps -------------------------------------------------
; Most textures ship without mipmaps (or with too few), and the
; material shaders always read the full-size texture. Result:
; shimmering wood and decks, sparkling sand. This adds the
; missing mipmaps and lets the shaders use them.
;   0 = original
;   1 = fixed (recommended)
MipFix=1

; --- Anisotropic filtering -----------------------------------
; Keeps textures sharp on surfaces seen at an angle.
;   0 = original
;   1..16 = filtering level (16 recommended)
Anisotropy=16

; --- Shadow resolution ---------------------------------------
; Bigger = sharper shadows with less crawling in motion.
;   1536 = original
;   2048
;   3072 = recommended (about 0.5 GB of video memory)
;   4096 = sharpest (about 0.9 GB of video memory)
ShadowResolution=3072

; --- Shadow speckles -----------------------------------------
; Game bug: the soft-shadow maths loses precision near objects,
; so some pixels inside shadows flicker fully lit.
;   0 = original
;   1..9 = fix strength: lower = stronger (shadow edges right
;          at contact get a little lighter). 5 = recommended
ShadowNoiseFix=5

; --- Ambient occlusion smoothing -----------------------------
; The game shows its ambient occlusion unfiltered: grainy,
; crawling dark noise in creases and where objects meet.
;   0 = original
;   1 = smoothed (recommended)
AOBlur=1

; --- Near clip -----------------------------------------------
; In zoomed-in (telephoto) shots, skin flickers through
; swimsuits. This moves the camera's near plane out with the
; zoom, up to this factor; normal and close shots are unchanged.
;   0 = original
;   10 = recommended
NearClip=10


; ============================================================
;  DISPLAY
; ============================================================

; --- Fullscreen resolution -----------------------------------
; In the Fullscreen screen mode the game always used the desktop
; size. This renders and displays at the size below instead,
; for NVIDIA DSR / AMD VSR (turn on the factor in the driver
; first). Never more than the largest mode your display offers.
; Window and borderless modes are unchanged.
;   0 = original
;   e.g. 3840x2160
MaxResolution=3840x2160


; ============================================================
;  FRAME RATE
; ============================================================

; --- Frame rate ----------------------------------------------
; The game's own 60 fps setting runs at this rate instead (its
; 30 fps setting at half of it). Game speed, animations and
; menus stay at their normal speed. With V-Sync on, your
; monitor's refresh rate is still the limit.
;   60 = original
;   61..360 (120 recommended on a 120 Hz+ screen)
FrameRate=120

; --- Fast menus ----------------------------------------------
; Only with FrameRate above 60.
;   0 = menu animations at their original speed (recommended)
;   1 = menu animations run faster (snappier menus)
FastMenus=0


; ============================================================
;  BOOT
; ============================================================

; --- Skip intro ----------------------------------------------
; Boot: Marvelous movie, XSEED, Tamsoft and CRI logos, then the
; opening movie.
;   0 = original
;   1 = skip the logos, keep the opening movie
;   2 = skip the logos and the opening movie (recommended)
; The very first start still shows the prologue, as the game does.
SkipIntro=2
